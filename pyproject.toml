[project]
name = "timeline-geotag"
version = "0.2.0"
description = "Geotag photos from Google Maps Timeline exports"
requires-python = ">=3.11"
dependencies = [
    "shtab>=1.12.1",
]

[project.scripts]
timeline-geotag = "timeline_geotag.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
